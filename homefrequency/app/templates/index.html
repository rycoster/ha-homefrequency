<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeFrequency</title>
    <base href="{{ ingress_path }}/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="v/2.13.3/style.css">
</head>
<body>
    <script>
        const BASE_PATH = "{{ ingress_path }}";
        // Show script errors on the page: phones have no console to check
        function showScriptError(msg) {
            const box = document.createElement('div');
            box.className = 'load-error';
            box.textContent = 'Script error: ' + msg;
            (document.querySelector('.container') || document.body).prepend(box);
        }
        window.addEventListener('error', e => {
            if (e.message) showScriptError(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`);
            else if (e.target && e.target.tagName === 'SCRIPT') showScriptError(`couldn't load ${e.target.src}`);
        }, true);
        window.addEventListener('unhandledrejection', e => showScriptError(String(e.reason)));
    </script>
    <div class="container">
        <div class="top-bar">
            <button id="add-task-toggle" class="add-task-toggle">+ New Task</button>
            <input type="search" id="task-filter" class="task-filter" placeholder="Filter tasks…" autocomplete="off" spellcheck="false">
        </div>
        <form id="add-task-form" class="add-task">
            <div class="add-task-row">
                <input type="text" id="task-name" placeholder="Task name" required>
                <div class="schedule-toggle">
                    <button type="button" class="toggle-btn" data-type="interval">Interval</button>
                    <button type="button" class="toggle-btn" data-type="fixed">Fixed</button>
                    <button type="button" class="toggle-btn active" data-type="dynamic">Dynamic</button>
                </div>
                <button type="button" id="toggle-notes" class="toggle-notes-btn" aria-label="Add notes" title="Add notes">&#128172;</button>
                <button type="submit">Add</button>
            </div>
            <div id="interval-fields" class="freq-group" style="display:none;">
                <input type="number" inputmode="numeric" id="task-freq" placeholder="#" min="1" value="1">
                <select id="task-unit">
                    <option value="1">days</option>
                    <option value="7">weeks</option>
                    <option value="30">months</option>
                    <option value="365">years</option>
                </select>
            </div>
            <div id="fixed-fields" class="freq-group" style="display:none;"></div>
            <textarea id="task-notes" placeholder="Notes (optional)" rows="2" style="display:none;"></textarea>
        </form>
        <div id="task-list" class="task-list"></div>
        <div class="data-tools">
            <span class="version-label">v2.13.3</span>
            <a id="btn-qr-sheet" class="data-btn" href="qr-sheet" target="_blank" rel="noopener" title="Open a printable sheet of all tasks with QR enabled">Print QR sheet</a>
            <button id="btn-export" class="data-btn">Export</button>
            <button id="btn-import" class="data-btn">Import</button>
            <input type="file" id="import-file" accept=".json" style="display:none;">
        </div>
    </div>
    <script src="v/2.13.3/vendor/qrcode.min.js"></script>
    <script src="v/2.13.3/app.js"></script>
</body>
</html>
