name: HomeFrequency
description: Recurring task tracker
version: 2.9.0
slug: homefrequency
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
ingress: true
ingress_port: 5050
panel_icon: mdi:clipboard-check-outline
panel_title: Home Frequency
panel_admin: false
hassio_api: true
homeassistant_api: true
discovery:
  - homefrequency
# Direct-port access is opt-in (null = user configures in add-on's Network
# panel). Only needed for printed QR codes to work from phones — everything
# else runs through ingress.
ports:
  "5050/tcp": null
map:
  - config:rw
